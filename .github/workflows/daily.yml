name: Hay Day Gift Bot Daily

on:
  schedule:
    - cron: '0 8 * * *'  # Her gün Türkiye saatiyle 11:00 (UTC 08:00)
  workflow_dispatch:      # Elle manuel çalıştırma

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri ve Tarayıcıyı Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Botu Çalıştır
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python main.py
